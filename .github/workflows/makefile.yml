name: Build Theos Tweak & Export Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: /Users/runner/theos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install & Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Install iOS SDKs
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/* $THEOS/sdks/
          rm -rf sdks-master master.zip

      - name: Compile Package
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS=$THEOS

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-Output-Files
          path: |
            packages/*.deb
            .theos/obj/*.dylib
            .theos/obj/debug/*.dylib
