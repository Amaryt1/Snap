name: Build Theos Tweak & Export Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies (ldid)
        run: |
          brew install ldid

      - name: Install & Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Install iOS SDKs
        run: |
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/* $GITHUB_WORKSPACE/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Auto-Create Missing Configuration Files
        run: |
          # إنشاء ملف Filter.plist في حال عدم وجوده
          if [ ! -f "SnapCloneEngine.plist" ] && [ ! -f "Filter.plist" ]; then
            cat << 'EOF' > SnapCloneEngine.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.toyopagroup.picaboo</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF
          fi

          # إنشاء ملف control المفقود تلقائياً
          if [ ! -f "control" ] && [ ! -f "layout/DEBIAN/control" ]; then
            cat << 'EOF' > control
          Package: com.developer.snapcloneengine
          Name: SnapCloneEngine
          Depends: mobilesubstrate
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Snap Clone Engine Tweak
          Maintainer: Developer
          Author: Developer
          Section: Tweaks
          EOF
          fi

      - name: Compile Package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-Output-Files
          path: |
            packages/*.deb
            .theos/obj/*.dylib
            .theos/obj/debug/*.dylib
